<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | QR code component</title>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap");

      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }

      * {
        margin: 0;
        box-sizing: border-box;
        font-family:
          "Outfit",
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Open Sans",
          "Helvetica Neue",
          sans-serif;
      }

      body {
        width: 100vw;
        height: 100vh;
        background-color: #d5e1ef;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      main {
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
      }

      .card {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 12px;
        width: 80%;
        padding: 15px 8px 30px 10px;
        border-radius: 12px;
        background-color: #fff;
      }

      .card img {
        width: 95%;
        border-radius: 12px;
      }

      .card h1 {
        color: #1f3044;
        font-weight: bold;
        font-size: 1.2rem;
      }

      .card p {
        color: #656774;
        font-size: 0.8rem;
      }

      .flex-text {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 85%;
      }
    </style>
  </head>
  <body>
    <header></header>

    <main>
      <article class="card">
        <div>
          <img src="/images/image-qr-code.png" alt="QR Code" />
        </div>
        <div class="flex-text">
          <div class="text">
            <h1>Improve your front-end skills by building projects</h1>
          </div>
          <div class="text">
            <p>
              Scan the QR code to visit Frontend Mentor and take your coding
              skills to the next level
            </p>
          </div>
        </div>
      </article>
    </main>
  </body>
</html>
